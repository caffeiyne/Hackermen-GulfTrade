# Render Blueprint — GulfTrade Intelligence
# Usage: Go to render.com → New → Blueprint → select this repo
# Everything in Singapore region to match DB.

databases:
  - name: gulftrade-db
    databaseName: gulftrade
    user: gulftrade_user
    region: singapore
    ipAllowList:
      - source: 0.0.0.0/0
        description: anywhere

services:

  # ── FastAPI Simulator Backend ────────────────────────────────────────
  - type: web
    name: gulftrade-simulator
    env: docker
    dockerfilePath: ./Dockerfile.simulator
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gulftrade-db
          property: connectionString
      - key: RUN_SEED
        value: "1"
      - key: CORS_ORIGINS
        value: '["https://gulftrade-dashboard.onrender.com"]'
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Next.js Dashboard Frontend ───────────────────────────────────────
  - type: web
    name: gulftrade-dashboard
    env: docker
    dockerfilePath: ./Dockerfile.dashboard
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gulftrade-db
          property: connectionString
      - key: NEXT_PUBLIC_API_URL
        value: https://gulftrade-simulator.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://gulftrade-simulator.onrender.com/ws/live
