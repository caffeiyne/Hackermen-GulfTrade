services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: tradling-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
      - ./db/disruptions.sql:/docker-entrypoint-initdb.d/03-disruptions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradling"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # pgAdmin (optional — for browsing the DB)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tradling-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tradling.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # FastAPI Simulator Backend
  # ============================================================================
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: tradling-simulator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tradling
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db:ro
    depends_on:
      db:
        condition: service_healthy
    # Run sales generator after DB is seeded, then start the API
    command: >
      sh -c "
        sleep 5 &&
        python /app/db/generate_sales.py --db-url postgresql://postgres:postgres@db:5432/tradling &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ============================================================================
  # Next.js Dashboard Frontend
  # ============================================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: tradling-dashboard
    restart: unless-stopped
    # No NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL set locally —
    # the app auto-detects from window.location.hostname:8000
    # so judges on the LAN can open http://<host-ip>:3000
    ports:
      - "3000:3000"
    depends_on:
      - simulator

volumes:
  pgdata:
